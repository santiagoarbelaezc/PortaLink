name: Deploy Backend PHP a Hostinger (backend-portalink + gateway /api)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend-php/**'
      - 'api-gateway/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Build & Deploy Backend (backend-portalink/ + public_html/api/)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐘 Configurar PHP 8.2 y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: 📦 Instalar dependencias de Composer (Producción)
        working-directory: backend-php
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          fi

      - name: 🚀 Desplegar backend-portalink/ (fuera de public_html) y gateway public_html/api/ vía SSH / rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '147.93.14.220' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USER: ${{ secrets.SSH_USER || 'u870397049' }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          # Configurar autenticación SSH (Llave privada o Contraseña) con ConnectTimeout
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15"
          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger
            SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/id_hostinger $SSH_OPTS"
            SSH_EXEC="ssh -p $SSH_PORT -i ~/.ssh/id_hostinger $SSH_OPTS $SSH_USER@$SSH_HOST"
            RSYNC_PREFIX=""
          else
            SSH_CMD="ssh -p $SSH_PORT $SSH_OPTS"
            SSH_EXEC="sshpass -p $SSH_PASSWORD ssh -p $SSH_PORT $SSH_OPTS $SSH_USER@$SSH_HOST"
            RSYNC_PREFIX="sshpass -p $SSH_PASSWORD"
          fi

          # Detectar la raíz del dominio (carpeta que CONTIENE a public_html)
          if $SSH_EXEC "[ -d domains/colchonesdistricol.com/public_html ]"; then
            DOMAIN_ROOT="domains/colchonesdistricol.com"
          else
            DOMAIN_ROOT="."
          fi

          TARGET_BACKEND="$DOMAIN_ROOT/backend-portalink/"   # FUERA de public_html
          TARGET_GATEWAY="$DOMAIN_ROOT/public_html/api/"     # solo el gateway

          echo "📍 Backend (fuera de public_html): $TARGET_BACKEND"
          echo "📍 Gateway (dentro de public_html): $TARGET_GATEWAY"

          $SSH_EXEC "mkdir -p $TARGET_BACKEND $TARGET_GATEWAY"

          # 1) Backend -> backend-portalink/
          # GARANTÍAS DE SEGURIDAD:
          # - --filter='protect .env*' y --exclude=".env*" protegen el .env de producción
          # - Se protegen logs/ y uploads/ existentes en el servidor
          $RSYNC_PREFIX rsync -avz --delete \
            --filter='protect .env' \
            --filter='protect .env.*' \
            --filter='protect logs/**' \
            --filter='protect uploads/**' \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="logs/**" \
            --exclude="uploads/**" \
            --exclude="*.log" \
            --exclude="backend-php.zip" \
            --exclude=".git*" \
            -e "$SSH_CMD" \
            backend-php/ \
            "$SSH_USER@$SSH_HOST:$TARGET_BACKEND"

          # 2) Gateway -> public_html/api/ (solo index.php + .htaccess, sin --delete
          #    sobre archivos ajenos más allá de esa carpeta)
          $RSYNC_PREFIX rsync -avz --delete \
            -e "$SSH_CMD" \
            api-gateway/ \
            "$SSH_USER@$SSH_HOST:$TARGET_GATEWAY"

          # Permisos
          $SSH_EXEC "find $TARGET_BACKEND -type d -exec chmod 755 {} + 2>/dev/null || true"
          $SSH_EXEC "find $TARGET_BACKEND -type f -exec chmod 644 {} + 2>/dev/null || true"
          $SSH_EXEC "chmod 600 ${TARGET_BACKEND}.env 2>/dev/null || true"
          $SSH_EXEC "find $TARGET_GATEWAY -type d -exec chmod 755 {} + 2>/dev/null || true"
          $SSH_EXEC "find $TARGET_GATEWAY -type f -exec chmod 644 {} + 2>/dev/null || true"

          echo "✅ Backend desplegado en $TARGET_BACKEND y gateway en $TARGET_GATEWAY"
